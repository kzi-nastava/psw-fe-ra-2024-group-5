<div class="edit-profile-page container">
  <mat-card class="form-container">
    <form [formGroup]="profileForm">

      <div class="profile-image-container">
        <img class="profile-img raised"
          [src]=" profileImage ? 'data:image/png;base64,'+profileImage : 'assets/images/profile.jpg'"
          alt="Profile Picture" />
        <div class="edit-pfimg-btn-container">
          <button class="secondary" mat-mini-fab (click)="triggerFileInput()">
            <mat-icon>edit</mat-icon>
          </button>
          <input type="file" id="profileImage" accept="image/*" (change)="onFileSelected($event)" hidden />
        </div>
      </div>

      <mat-form-field class="form-field">
        <mat-label>Name</mat-label>
        <input matInput placeholder="Firstname" id="name" formControlName="name">
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Surname</mat-label>
        <input matInput placeholder="Lastname" id="surname" formControlName="surname">
      </mat-form-field>

      <div class="form-card">
         <div class="card-header">
        <mat-icon>note</mat-icon>
        <span>Biography</span>
      </div>
    <textarea placeholder="Tell something about yourself..." formControlName="biography"></textarea>
  </div>

    <div class="form-card">
     <div class="card-header">
      <mat-icon>emoji_objects</mat-icon>
       <span>Motto</span>
    </div>
    <textarea placeholder="What's your personal motto?" formControlName="motto"></textarea>
  </div>


      <div class="form-actions">
        <button class="secondary" mat-button [disabled]="profileForm.invalid" (click)="onSubmit()">
          <mat-icon>save</mat-icon>
          Save Profile
        </button>
      </div>
    </form>
  </mat-card>
</div>
